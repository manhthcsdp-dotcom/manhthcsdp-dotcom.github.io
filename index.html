 rõ ràng, mềm mại**, gần giống với giọng hát cao (giọng kim).\\n*   Có khả năng biểu đạt cảm xúc phong phú, từ tình cảm trữ tình, sâu lắng đến sinh động, nhiệt tình.\\n*   Có thể mô phỏng tiếng gió rít, tiếng chim hót.\\n*   Người chơi có thể điều chỉnh âm thanh bằng cách bịt bát nhị bằng đầu gối hoặc ngón chân để tạo ra âm thanh vang vọng, mơ hồ, xa vắng, lạnh lẽo, hoặc u tối, thể hiện các tâm trạng buồn phiền, ưu tư.logseq____&quot;,536870920]],[logseq____&quot;^15logseq____&quot;,[44,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^17logseq____&quot;,536870920]],[logseq____&quot;^15logseq____&quot;,[44,logseq____&quot;^Flogseq____&quot;,54,536870920]],[logseq____&quot;^15logseq____&quot;,[44,logseq____&quot;^Xlogseq____&quot;,29,536870920]],[logseq____&quot;^15logseq____&quot;,[44,logseq____&quot;^Vlogseq____&quot;,29,536870920]],[logseq____&quot;^15logseq____&quot;,[44,logseq____&quot;^Ulogseq____&quot;,29,536870920]],[logseq____&quot;^15logseq____&quot;,[44,logseq____&quot;^?logseq____&quot;,[logseq____&quot;^ logseq____&quot;,logseq____&quot;^18logseq____&quot;,2],536870920]],[logseq____&quot;^15logseq____&quot;,[44,logseq____&quot;^Jlogseq____&quot;,[],536870920]],[logseq____&quot;^15logseq____&quot;,[44,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u691c2c33-c3b6-464c-91e6-f6514e329b0blogseq____&quot;,536870920]],[logseq____&quot;^15logseq____&quot;,[45,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;##  Vai trò trong Âm nhạc Việt Nam\\nĐàn nhị đóng vai trò quan trọng trong nhiều thể loại âm nhạc dân tộc và truyền thống của Việt Nam:\\n*   **Hát Xẩm**: Giữ vai trò đệm chủ đạo.\\n*   **Nhã nhạc cung đình, phường bát âm, chầu văn**: Là thành phần không thể thiếu.\\n*   **Đờn ca tài tử, cải lương, tuồng, chèo, hát dân ca**.\\n*   Trong các dàn nhạc dân tộc tổng hợp.\\n*   Đặc biệt, trong **nhạc đám ma (nhạc hiếu)**, tiếng đàn nhị mang vai trò quan trọng nhất, thể hiện sự ai oán, não lòng đối với người đã khuất.\\n*   Ngày nay, đàn nhị còn xuất hiện       // This script checks to see if a redirect is present in the query string
      // and converts it back into the correct url and adds it to the
      // browser's history using window.history.replaceState(...),
      // which won't cause the browser to attempt to load the new url.
      // When the single page app is loaded further down in this file,
      // the correct url will be waiting in the browser's history for
      // the single page app to route accordingly.
      (function(l) {
        if (l.search) {
          var q = {};
          l.search.slice(1).split('&').forEach(function(v) {
            var a = v.split('=');
            q[a[0]] = a.slice(1).join('=').replace(/~and~/g, '&');
          });
          if (q.p !== undefined) {
            window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + (q.p || '') +
              (q.q ? ('?' + q.q) : '') +
              l.hash
            );
          }
        }
